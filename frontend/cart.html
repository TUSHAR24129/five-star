<title>My Cart — FIVE STAR RETAIL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede6;--border:#e5e0d6;
  --fg:#1a1208;--fg2:#6b6050;--fg3:#9c8f7e;
  --accent:#2d6a4f;--accent-mid:#40916c;--accent-lt:#d8f3dc;
  --gold:#e9a924;--gold-lt:#fef3c7;
  --hero-bg:#1a2e1e;--nav-bg:#1a2e1e;
  --danger:#dc2626;--danger-lt:#fee2e2;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(26,18,8,.08);--shadow-lg:0 8px 32px rgba(26,18,8,.14);
  font-variant-numeric:tabular-nums;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a10;--surface:#172218;--surface2:#1f2e21;--border:#2a3c2c;
  --fg:#e8f5ea;--fg2:#9ab89d;--fg3:#6a8a6d;
  --accent:#52b788;--accent-mid:#74c69d;--accent-lt:#1b4332;
  --gold:#f59e0b;--gold-lt:#292008;--hero-bg:#0a1a0c;--nav-bg:#0d1f10;
  --danger:#f87171;--danger-lt:#2d1414;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1a10;--surface:#172218;--surface2:#1f2e21;--border:#2a3c2c;
  --fg:#e8f5ea;--fg2:#9ab89d;--fg3:#6a8a6d;
  --accent:#52b788;--accent-mid:#74c69d;--accent-lt:#1b4332;
  --gold:#f59e0b;--gold-lt:#292008;--hero-bg:#0a1a0c;--nav-bg:#0d1f10;
  --danger:#f87171;--danger-lt:#2d1414;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;}

.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--nav-bg);
  padding:0 max(24px,env(safe-area-inset-left,0px));display:flex;align-items:center;
  justify-content:space-between;gap:20px;min-height:64px;border-bottom:1px solid rgba(255,255,255,.06);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:110;background:var(--nav-bg);}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;
  font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;white-space:nowrap;}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none;flex-wrap:wrap;}
.nav-links a{color:rgba(255,255,255,.75);text-decoration:none;padding:6px 12px;
  border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;transition:color .2s,background .2s;}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.1);}
.nav-actions{display:flex;align-items:center;gap:8px;}
.nav-btn{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:8px 14px;font-size:.85rem;font-weight:600;
  font-family:inherit;cursor:pointer;text-decoration:none;transition:background .2s;}
.nav-btn:hover{background:var(--accent-mid);}

.page-hero{background:var(--hero-bg);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:48px max(40px,env(safe-area-inset-left,0px)) 52px;position:relative;overflow:hidden;}
.page-hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 50% 100% at 100% 50%,rgba(64,145,108,.2) 0%,transparent 70%);pointer-events:none;}
.page-hero-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:24px;flex-wrap:wrap;}
.page-hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);
  font-weight:800;color:#fff;line-height:1.2;}
.page-hero p{color:rgba(255,255,255,.6);margin-top:6px;font-size:.95rem;}
.hero-icon{font-size:3.5rem;opacity:.85;}

.main-wrap{max-width:900px;margin:0 auto;padding-block:32px 60px;}

/* Alert */
.alert{padding:12px 18px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;margin-bottom:20px;display:none;}
.alert.show{display:block;}
.alert-success{background:var(--accent-lt);color:var(--accent);}
.alert-danger{background:var(--danger-lt);color:var(--danger);}
.alert-warning{background:var(--gold-lt);color:#92570c;}

/* Cart layout */
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;}
@media(max-width:720px){.cart-layout{grid-template-columns:1fr;}}

/* Cart table card */
.cart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;}
.cart-card-header{padding:18px 20px;border-bottom:1px solid var(--border);
  font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;
  display:flex;align-items:center;gap:10px;}
.cart-table{width:100%;border-collapse:collapse;}
.cart-table th{text-align:left;padding:10px 16px;background:var(--surface2);
  color:var(--fg2);font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.cart-table th:last-child{text-align:right;}
.cart-table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
.cart-table tr:last-child td{border-bottom:none;}
.product-name{font-weight:600;font-size:.9rem;}
.product-unit{font-size:.75rem;color:var(--fg3);margin-top:2px;}
.qty-cell{color:var(--fg2);font-weight:500;text-align:center;}
.price-cell{color:var(--fg2);font-size:.875rem;}
.subtotal-cell{font-weight:700;color:var(--accent);text-align:right;}
.btn-remove{background:none;border:1px solid var(--border);color:var(--fg3);
  border-radius:6px;padding:5px 10px;font-size:.75rem;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-remove:hover{border-color:var(--danger);color:var(--danger);}

/* Summary card */
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;position:sticky;top:84px;}
.summary-card h3{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:18px;}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;
  font-size:.875rem;color:var(--fg2);border-bottom:1px solid var(--border);}
.summary-row:last-of-type{border-bottom:none;}
.summary-row.total{font-size:1.1rem;font-weight:700;color:var(--fg);padding-top:14px;}
.summary-row.total .amt{color:var(--accent);font-size:1.2rem;}
.btn-checkout{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-sm);font-size:1rem;font-weight:700;font-family:inherit;
  cursor:pointer;margin-top:16px;transition:background .2s,transform .15s;}
.btn-checkout:hover{background:var(--accent-mid);transform:translateY(-1px);}
.btn-checkout:disabled{background:var(--fg3);cursor:not-allowed;transform:none;}
.btn-continue{display:block;text-align:center;margin-top:12px;color:var(--accent);
  text-decoration:none;font-size:.85rem;font-weight:500;}
.btn-continue:hover{text-decoration:underline;}

.secure-note{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:.75rem;color:var(--fg3);margin-top:14px;}

/* Empty */
.spinner-wrap{text-align:center;padding:60px;color:var(--fg3);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:60px 20px;color:var(--fg3);}
.empty-state .big{font-size:3.5rem;margin-bottom:14px;}
.empty-state h3{font-size:1.1rem;color:var(--fg2);margin-bottom:8px;}
.btn-shop{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;
  text-decoration:none;padding:10px 22px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;}
.btn-shop:hover{background:var(--accent-mid);}

footer{background:var(--nav-bg);color:rgba(255,255,255,.5);text-align:center;
  padding:28px max(24px,env(safe-area-inset-left,0px));font-size:.82rem;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));}
footer strong{color:rgba(255,255,255,.8);}
@media(max-width:600px){.page-hero{padding:36px 24px 42px;}.nav-links{display:none;}.hero-icon{display:none;}}
@media(prefers-reduced-motion:reduce){.btn-checkout,.btn-remove{transition:none;}.spinner{animation:none;}}
</style>

<nav class="navbar">
  <a class="nav-brand" href="index.html">🌿 FIVE STAR RETAIL</a>
  <ul class="nav-links">
    <li><a href="home.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="cart.html" class="active">Cart</a></li>
    <li><a href="orders.html">Orders</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="About_us.html">About Us</a></li>
  </ul>
  <div class="nav-actions">
    <a href="login.html" id="login-nav" style="color:rgba(255,255,255,.7);text-decoration:none;font-size:.875rem;font-weight:500;padding:6px 10px;">Login</a>
    <a class="nav-btn" href="products.html">🛒 Shop</a>
  </div>
</nav>

<section class="page-hero">
  <div class="page-hero-inner">
    <div>
      <h1>Your Cart</h1>
      <p>Review your items and proceed to checkout</p>
    </div>
    <div class="hero-icon">🛒</div>
  </div>
</section>

<div class="main-wrap">
  <div id="alert-box" class="alert"></div>
  <div id="cart-root">
    <div class="spinner-wrap"><div class="spinner"></div><p>Loading your cart…</p></div>
  </div>
</div>

<footer><strong>🌿 FIVE STAR RETAIL</strong> — © 2026</footer>

<script>
const API='http://localhost:3000';
const userId=localStorage.getItem('userId')||3;
let cartData=null;

function updateNav(){const n=localStorage.getItem('userName');const e=document.getElementById('login-nav');if(n&&e)e.textContent='👤 '+n;}

async function loadCart(){
  try{
    const res=await fetch(`${API}/api/cart/${userId}`);
    cartData=await res.json();
    renderCart();
  }catch(e){
    document.getElementById('cart-root').innerHTML=`<div class="empty-state"><div class="big">⚠️</div><h3>Can't connect to server</h3><p>Make sure <code>node server.js</code> is running.</p></div>`;
  }
}

function renderCart(){
  const{items,item_count,cart_total}=cartData;
  if(!items||!items.length){
    document.getElementById('cart-root').innerHTML=`
      <div class="empty-state"><div class="big">🛒</div><h3>Your cart is empty</h3>
      <p>Add some fresh items to get started.</p>
      <a href="products.html" class="btn-shop">Browse Products →</a></div>`;
    return;
  }
  const rows=items.map(i=>`
    <tr>
      <td><div class="product-name">${i.product}</div><div class="product-unit">per ${i.unit||'ea'}</div></td>
      <td class="qty-cell">${i.quantity}</td>
      <td class="price-cell">$${parseFloat(i.price).toFixed(2)}</td>
      <td class="subtotal-cell">$${parseFloat(i.subtotal).toFixed(2)}</td>
      <td><button class="btn-remove" onclick="removeItem(${i.id},'${i.product.replace(/'/g,"\\'")}')">Remove</button></td>
    </tr>`).join('');
  const delivery=parseFloat(cart_total)>=50?0:5.99;
  const total=(parseFloat(cart_total)+delivery).toFixed(2);
  document.getElementById('cart-root').innerHTML=`
    <div class="cart-layout">
      <div class="cart-card">
        <div class="cart-card-header">🛒 ${item_count} Item${item_count!==1?'s':''}</div>
        <div style="overflow-x:auto;">
          <table class="cart-table">
            <thead><tr><th>Product</th><th style="text-align:center">Qty</th><th>Unit Price</th><th style="text-align:right">Subtotal</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal (${item_count} items)</span><span>$${parseFloat(cart_total).toFixed(2)}</span></div>
        <div class="summary-row"><span>Delivery</span><span>${delivery===0?'<span style="color:var(--accent)">Free</span>':'$'+delivery.toFixed(2)}</span></div>
        ${parseFloat(cart_total)<50?`<div style="font-size:.75rem;color:var(--accent);margin:4px 0 0;padding:8px 0;border-top:1px dashed var(--border);">Add $${(50-parseFloat(cart_total)).toFixed(2)} more for free delivery!</div>`:''}
        <div class="summary-row total"><span>Total</span><span class="amt">$${total}</span></div>
        <button class="btn-checkout" onclick="checkout()">✅ Place Order</button>
        <a href="products.html" class="btn-continue">← Continue Shopping</a>
        <div class="secure-note">🔒 Secure checkout</div>
      </div>
    </div>`;
}

async function removeItem(productId,name){
  try{
    const res=await fetch(`${API}/api/cart/${userId}/${productId}`,{method:'DELETE'});
    if(res.ok){showAlert('✅ '+name+' removed from cart.','success');await loadCart();}
    else showAlert('❌ Could not remove item.','danger');
  }catch(e){showAlert('❌ Server error.','danger');}
}

async function checkout(){
  const btn=document.querySelector('.btn-checkout');
  if(btn){btn.disabled=true;btn.textContent='Processing…';}
  try{
    const res=await fetch(`${API}/api/cart/${userId}`);
    const data=await res.json();
    if(!data.items||!data.items.length){showAlert('Your cart is empty.','warning');if(btn){btn.disabled=false;btn.textContent='✅ Place Order';}return;}
    const orderRes=await fetch(`${API}/api/orders`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:userId,total_amount:data.cart_total,
        payment_method:'card',delivery_address:'123 Main St',
        items:data.items.map(i=>({product_id:i.id,quantity:i.quantity,unit_price:i.price}))})
    });
    if(orderRes.ok){showAlert('✅ Order placed! Redirecting…','success');setTimeout(()=>{window.location.href='orders.html';},1500);}
    else{showAlert('❌ Checkout failed. Please try again.','danger');if(btn){btn.disabled=false;btn.textContent='✅ Place Order';}}
  }catch(e){showAlert('❌ Server error.','danger');if(btn){btn.disabled=false;btn.textContent='✅ Place Order';}}
}

function showAlert(msg,type){
  const box=document.getElementById('alert-box');
  box.className='alert alert-'+type+' show';box.textContent=msg;
  setTimeout(()=>box.classList.remove('show'),3500);
}
updateNav();loadCart();
</script>
