<style>
/* ── Design tokens (matches Fresh Market theme) ─────────────── */
:root {
  --bg:         #f7f5f0;

  --border:     #e5e0d6;

  --accent-mid: #40916c;
  --accent-lt:  #d8f3dc;
  --gold:       #e9a924;
  --gold-lt:    #fef3c7;
  --hero-bg:    #1a2e1e;
  --nav-bg:     #1a2e1e;
  --danger:     #dc2626;
  --danger-lt:  #fee2e2;

@media (prefers-color-scheme: dark) {

    --surface2:  #1f2e21;
    --border:    #2a3c2c;
    --fg:        #e8f5ea;
    --fg2:       #9ab89d;
    --fg3:       #6a8a6d;
    --accent:    #52b788;
    --accent-mid:#74c69d;
    --accent-lt: #1b4332;
    --gold:      #f59e0b;
    --gold-lt:   #292008;
    --hero-bg:   #0a1a0c;
    --nav-bg:    #0d1f10;
    --danger:    #f87171;
    --danger-lt: #2d1414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:        #0e1a10;
  --surface:   #172218;
  --surface2:  #1f2e21;
  --border:    #2a3c2c;
  --fg:        #e8f5ea;
  --fg2:       #9ab89d;
  --fg3:       #6a8a6d;
  --accent:    #52b788;
  --accent-mid:#74c69d;
  --accent-lt: #1b4332;

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;

  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

/* ── Navbar ─────────────────────────────────────────────────── */
.navbar {

  padding: 0 max(24px, env(safe-area-inset-left, 0px));

}

}
.nav-brand {

}
.nav-links {

/* ── Page hero ───────────────────────────────────────────────── */

/* ── Status filter tabs ──────────────────────────────────────── */

}
.order-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

.order-card-top {
  display: flex;
  align-items: center;

}

.order-id { font-weight: 700; font-size: 1rem; }

.s-pending        { background: var(--gold-lt); color: #92570c; }
.s-processing     { background: #dbeafe; color: #1d4ed8; }
.s-packed         { background: #ede9fe; color: #6d28d9; }

@media (prefers-color-scheme: dark) {

  :root:not([data-theme="light"]) .s-packed      { background: #2e1065; color: #c4b5fd; }

/* ── Footer ──────────────────────────────────────────────────── */
footer {

    <button class="tab-btn" data-status="pending"          onclick="filterStatus('pending', this)">⏳ Pending</button>

<script>
const API = 'http://localhost:3000';
const userId = localStorage.getItem('userId') || 3;

let allOrders = [];
let activeStatus = 'all';

const statusMeta = {
  delivered:        { cls: 's-delivered',        label: '✅ Delivered',         icon: '✅' },
  pending:          { cls: 's-pending',           label: '⏳ Pending',           icon: '⏳' },
  processing:       { cls: 's-processing',        label: '⚙️ Processing',        icon: '⚙️' },
  packed:           { cls: 's-packed',            label: '📦 Packed',            icon: '📦' },
  out_for_delivery: { cls: 's-out_for_delivery',  label: '🚚 Out for Delivery',  icon: '🚚' },
  cancelled:        { cls: 's-cancelled',         label: '❌ Cancelled',         icon: '❌' },
};

function updateNav() {
  const name = localStorage.getItem('userName');
  const el = document.getElementById('login-nav');
  if (name && el) el.textContent = '👤 ' + name;
}

async function loadOrders() {
  try {
    const res = await fetch(`${API}/api/orders`);
    const data = await res.json();
    // Show all orders or filter to current user
    allOrders = (data.orders || []).filter(o =>
      !o.user_id || String(o.user_id) === String(userId)
    );
    if (!allOrders.length) allOrders = data.orders || [];
    renderOrders();
  } catch (e) {
    document.getElementById('orders-list').innerHTML = `
      <div class="empty-state">
        <div class="big">⚠️</div>
        <h3>Can't connect to server</h3>
        <p>Make sure <code>node server.js</code> is running on port 3000.</p>
      </div>`;
  }
}

function filterStatus(status, btn) {
  activeStatus = status;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const filtered = activeStatus === 'all'
    ? allOrders
    : allOrders.filter(o => o.status === activeStatus);

  const title = activeStatus === 'all' ? 'All Orders'
    : (statusMeta[activeStatus]?.label || activeStatus);
  document.getElementById('section-title').textContent = title;
  document.getElementById('order-count').textContent =
    filtered.length + ' order' + (filtered.length !== 1 ? 's' : '');

  if (!filtered.length) {
    document.getElementById('orders-list').innerHTML = `
      <div class="empty-state">
        <div class="big">🛍️</div>
        <h3>${activeStatus === 'all' ? 'No orders yet' : 'No ' + activeStatus + ' orders'}</h3>
        <p>Start shopping to see your orders here.</p>
        <a href="products.html" class="btn-shop">Browse Products →</a>
      </div>`;
    return;
  }

  document.getElementById('orders-list').innerHTML = filtered.map(o => {
    const sm = statusMeta[o.status] || { cls: 's-pending', label: o.status, icon: '📋' };
    const dateStr = new Date(o.created_at).toLocaleDateString('en-AU', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
    const payIcon = o.payment_method === 'card' ? '💳' : o.payment_method === 'cash' ? '💵' : '💰';
    return `
      <div class="order-card">
        <div class="order-card-top">
          <div class="order-id-block">
            <div class="icon">${sm.icon}</div>
            <div>
              <div class="order-id">Order #${o.id}</div>
              <div class="order-date">${dateStr}</div>
            </div>
          </div>
          <span class="status-pill ${sm.cls}">${sm.label}</span>
        </div>
        <div class="order-card-meta">
          <div class="meta-item">Customer<br><strong>${o.username || 'You'}</strong></div>
          <div class="meta-item">Payment<br><strong style="text-transform:capitalize">${o.payment_status || 'paid'}</strong></div>
          <div class="meta-item">Total<br><span class="meta-total">$${parseFloat(o.total_amount).toFixed(2)}</span></div>
          ${o.delivery_address ? `<div class="meta-item">Deliver to<br><strong>${o.delivery_address}</strong></div>` : ''}
        </div>
        <div class="order-card-footer">
          <div class="payment-info">${payIcon} ${o.payment_method || 'card'}</div>
          <button class="btn-view" onclick="viewOrder(${o.id})">View Receipt →</button>
        </div>
      </div>`;
  }).join('');
}

async function viewOrder(orderId) {
  document.getElementById('modal-title').textContent = `Order #${orderId}`;
  document.getElementById('modal-body').innerHTML =
    '<div class="spinner-wrap"><div class="spinner"></div><p>Loading…</p></div>';
  document.getElementById('modal').classList.add('show');

  try {
    const res = await fetch(`${API}/api/orders/${orderId}`);
    const data = await res.json();
    const { order, items } = data;
    const sm = statusMeta[order.status] || { cls: 's-pending', label: order.status };
    const dateStr = new Date(order.created_at).toLocaleDateString('en-AU', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    document.getElementById('modal-body').innerHTML = `
      <div class="modal-status-row">
        <span class="status-pill ${sm.cls}">${sm.label}</span>
        <span class="modal-meta">${dateStr}</span>
      </div>

      <div style="overflow-x:auto;">
        <table class="items-table">
          <thead>
            <tr>
              <th>Product</th>
              <th style="text-align:center">Qty</th>
              <th style="text-align:right">Price</th>
              <th style="text-align:right">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>
                  <div class="item-name">${i.product}</div>
                  <div class="item-unit">per ${i.unit || 'ea'}</div>
                </td>
                <td style="text-align:center;color:var(--fg2)">${i.quantity}</td>
                <td style="text-align:right;color:var(--fg2)">$${parseFloat(i.unit_price).toFixed(2)}</td>
                <td style="text-align:right;font-weight:600">$${parseFloat(i.subtotal).toFixed(2)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="modal-total-row">
        <span>Order Total</span>
        <span class="total-amt">$${parseFloat(order.total_amount).toFixed(2)}</span>
      </div>

      ${order.delivery_address || order.delivery_notes ? `
        <div class="modal-notes">
          ${order.delivery_address ? `📍 <strong>Deliver to:</strong> ${order.delivery_address}<br>` : ''}
          ${order.delivery_notes  ? `📝 <strong>Notes:</strong> ${order.delivery_notes}` : ''}
        </div>` : ''}
    `;
  } catch (e) {
    document.getElementById('modal-body').innerHTML =
      '<p style="color:var(--danger);padding:20px">Failed to load order details.</p>';
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

updateNav();
loadOrders();
</script>
