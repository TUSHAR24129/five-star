<title>Sign In — FIVE STAR RETAIL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f7f5f0;--surface:#ffffff;--surface2:#f0ede6;--border:#e5e0d6;
  --fg:#1a1208;--fg2:#6b6050;--fg3:#9c8f7e;
  --accent:#2d6a4f;--accent-mid:#40916c;--accent-lt:#d8f3dc;
  --hero-bg:#1a2e1e;--nav-bg:#1a2e1e;
  --danger:#dc2626;--danger-lt:#fee2e2;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(26,18,8,.08);--shadow-lg:0 8px 32px rgba(26,18,8,.14);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a10;--surface:#172218;--surface2:#1f2e21;--border:#2a3c2c;
  --fg:#e8f5ea;--fg2:#9ab89d;--fg3:#6a8a6d;--accent:#52b788;--accent-mid:#74c69d;
  --accent-lt:#1b4332;--hero-bg:#0a1a0c;--nav-bg:#0d1f10;
  --danger:#f87171;--danger-lt:#2d1414;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1a10;--surface:#172218;--surface2:#1f2e21;--border:#2a3c2c;
  --fg:#e8f5ea;--fg2:#9ab89d;--fg3:#6a8a6d;--accent:#52b788;--accent-mid:#74c69d;
  --accent-lt:#1b4332;--hero-bg:#0a1a0c;--nav-bg:#0d1f10;
  --danger:#f87171;--danger-lt:#2d1414;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--hero-bg);color:var(--fg);font-family:'Inter',sans-serif;line-height:1.6;
  display:flex;flex-direction:column;min-height:100%;}

/* Minimal nav */
.navbar{background:transparent;padding:0 max(24px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;min-height:60px;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;
  font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;}
.nav-back{color:rgba(255,255,255,.65);text-decoration:none;font-size:.85rem;
  font-weight:500;padding:6px 12px;border:1px solid rgba(255,255,255,.2);
  border-radius:var(--radius-sm);transition:all .2s;}
.nav-back:hover{background:rgba(255,255,255,.1);color:#fff;}

/* Full-page bg */
.page-bg{flex:1;background:var(--hero-bg);
  background-image:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(64,145,108,.4) 0%,transparent 65%);
  display:flex;align-items:center;justify-content:center;
  padding:32px max(16px,env(safe-area-inset-left,0px)) 60px;}

/* Card */
.login-card{background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);width:100%;max-width:400px;overflow:hidden;}
.card-top{padding:32px 32px 24px;text-align:center;background:var(--surface);}
.card-logo{font-size:2.6rem;margin-bottom:12px;}
.card-top h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:800;
  color:var(--fg);margin-bottom:6px;}
.card-top p{color:var(--fg2);font-size:.88rem;}

.card-body{padding:0 32px 32px;}

/* Tabs */
.auth-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px;}
.tab-btn{flex:1;background:none;border:none;padding:12px;font-family:inherit;
  font-size:.9rem;font-weight:600;color:var(--fg3);cursor:pointer;
  position:relative;transition:color .2s;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active::after{content:"";position:absolute;bottom:-2px;left:0;right:0;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Form */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--fg2);margin-bottom:6px;}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg);color:var(--fg);
  font-family:inherit;font-size:.9rem;transition:border-color .2s;outline:none;}
.form-group input:focus{border-color:var(--accent);}
.form-group input.error{border-color:var(--danger);}

.form-hint{font-size:.75rem;color:var(--fg3);margin-top:4px;}

.btn-submit{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-sm);font-size:1rem;font-weight:700;font-family:inherit;
  cursor:pointer;margin-top:4px;transition:background .2s,transform .15s;}
.btn-submit:hover{background:var(--accent-mid);transform:translateY(-1px);}
.btn-submit:disabled{background:var(--fg3);cursor:not-allowed;transform:none;}

/* Alert */
.alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:.85rem;
  font-weight:500;margin-bottom:16px;display:none;}
.alert.show{display:block;}
.alert-danger{background:var(--danger-lt);color:var(--danger);}
.alert-success{background:var(--accent-lt);color:var(--accent);}

/* Divider */
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--fg3);font-size:.8rem;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

/* Guest link */
.guest-link{text-align:center;margin-top:12px;}
.guest-link a{color:var(--accent);text-decoration:none;font-size:.85rem;font-weight:500;}
.guest-link a:hover{text-decoration:underline;}

footer{background:var(--nav-bg);color:rgba(255,255,255,.4);text-align:center;
  padding:20px;font-size:.78rem;}
footer strong{color:rgba(255,255,255,.65);}

@media(max-width:480px){.card-top{padding:24px 24px 18px;}.card-body{padding:0 24px 24px;}}
@media(prefers-reduced-motion:reduce){.btn-submit{transition:none;}}
</style>

<!-- Nav -->
<nav class="navbar">
  <a class="nav-brand" href="index.html">🌿 FIVE STAR RETAIL</a>
  <a class="nav-back" href="index.html">← Back</a>
</nav>

<!-- Card -->
<div class="page-bg">
  <div class="login-card">
    <div class="card-top">
      <div class="card-logo">🌿</div>
      <h1>Welcome back</h1>
      <p>Sign in to your FIVE STAR RETAIL account</p>
    </div>
    <div class="card-body">

      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login',this)">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register',this)">Create Account</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="tab-panel active" id="panel-login">
        <div class="alert alert-danger" id="login-error"></div>
        <div class="alert alert-success" id="login-success"></div>
        <form onsubmit="doLogin(event)">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-pass">Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-submit" id="login-btn">Sign In →</button>
        </form>
        <div class="guest-link">
          <a href="products.html">Browse as guest →</a>
        </div>
      </div>

      <!-- REGISTER PANEL -->
      <div class="tab-panel" id="panel-register">
        <div class="alert alert-danger" id="reg-error"></div>
        <div class="alert alert-success" id="reg-success"></div>
        <form onsubmit="doRegister(event)">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Jane Smith" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone (optional)</label>
            <input type="tel" id="reg-phone" placeholder="+61 400 000 000" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="reg-pass">Password</label>
            <input type="password" id="reg-pass" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
            <div class="form-hint">At least 6 characters</div>
          </div>
          <div class="form-group">
            <label for="reg-pass2">Confirm Password</label>
            <input type="password" id="reg-pass2" placeholder="Repeat password" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn-submit" id="reg-btn">Create Account →</button>
        </form>
      </div>

    </div>
  </div>
</div>

<footer><strong>🌿 FIVE STAR RETAIL</strong> — © 2026</footer>

<script>
const API='http://localhost:3000';

function switchTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
}

function showAlert(id,msg,type){
  const el=document.getElementById(id);
  el.textContent=msg;el.className='alert alert-'+type+' show';
  setTimeout(()=>el.classList.remove('show'),4000);
}

async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('login-btn');
  btn.disabled=true;btn.textContent='Signing in…';
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-pass').value;
  try{
    const res=await fetch(`${API}/api/users/login`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data=await res.json();
    if(res.ok&&data.user){
      localStorage.setItem('userId',data.user.id);
      localStorage.setItem('userName',data.user.name||data.user.email);
      showAlert('login-success','✅ Welcome back, '+(data.user.name||'there')+'! Redirecting…','success');
      setTimeout(()=>{window.location.href='home.html';},1200);
    } else {
      showAlert('login-error',data.message||'Invalid email or password.','danger');
      btn.disabled=false;btn.textContent='Sign In →';
    }
  }catch(err){
    showAlert('login-error','⚠️ Could not connect to server. Is it running?','danger');
    btn.disabled=false;btn.textContent='Sign In →';
  }
}

async function doRegister(e){
  e.preventDefault();
  const btn=document.getElementById('reg-btn');
  const p1=document.getElementById('reg-pass').value;
  const p2=document.getElementById('reg-pass2').value;
  if(p1!==p2){showAlert('reg-error','Passwords do not match.','danger');return;}
  btn.disabled=true;btn.textContent='Creating account…';
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const phone=document.getElementById('reg-phone').value.trim();
  const password=p1;
  try{
    const res=await fetch(`${API}/api/users/register`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,email,password,phone:phone||undefined})
    });
    const data=await res.json();
    if(res.ok){
      showAlert('reg-success','✅ Account created! Signing you in…','success');
      if(data.user){localStorage.setItem('userId',data.user.id);localStorage.setItem('userName',data.user.name||data.user.email);}
      setTimeout(()=>{window.location.href='home.html';},1400);
    } else {
      showAlert('reg-error',data.message||'Registration failed. Try a different email.','danger');
      btn.disabled=false;btn.textContent='Create Account →';
    }
  }catch(err){
    showAlert('reg-error','⚠️ Could not connect to server.','danger');
    btn.disabled=false;btn.textContent='Create Account →';
  }
}
</script>
